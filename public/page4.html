<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Djibouti Money - Résumé de Demande</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #ffffff; --card-bg: #fffdf5; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .app-header { width: 100%; background: #ffffff; border-bottom: 2px solid #fef08a; height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .back-btn-top { color: #ca8a04; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 800; color: #ca8a04; }
        .card { background: var(--card-bg); width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px; border-radius: 16px; border: 1px solid #fef08a; box-shadow: 0 4px 20px rgba(0,0,0,0.03); display: flex; flex-direction: column; }
        .main-title { font-size: 24px; color: #111; margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: #666; text-align: center; margin-bottom: 20px; }
        .step-indicator { display: flex; gap: 10px; margin: 0 auto 28px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #eab308; border-radius: 2px; }
        .form-group { margin-bottom: 18px; display: flex; flex-direction: column; }
        .form-group label { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 6px; }
        .form-control { font-size: 15px; padding: 14px; border: 1px solid #fde047; border-radius: 10px; background: #fff; outline: none; width: 100%; }
        .summary-card { background: #fefce8; border-left: 4px solid #eab308; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .btn-container { display: flex; gap: 10px; margin-top: 10px; }
        .btn-prev { background: #f3f4f6; color: #4b5563; border: none; flex: 1; padding: 15px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-next { background: #eab308; color: #000; border: none; flex: 1; padding: 15px; border-radius: 10px; font-weight: 800; cursor: pointer; }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #666; margin-top: auto; }
    </style>
</head>
<body>
<div class="app-header">
    <a href="/page3" class="back-btn-top">← Retour</a>
    <div class="header-title">Djibouti Money</div>
    <div style="width: 24px;"></div>
</div>

<div class="card">
    <h1 class="main-title">Validation</h1>
    <div class="subtext">Étape 3 sur 3</div>

    <div class="step-indicator">
        <div class="step-bar"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <form onsubmit="submitForm(event)">
        <div class="form-group">
            <label>Statut Professionnel</label>
            <select id="jobStatus" class="form-control" required>
                <option value="Employé">Employé(e)</option>
                <option value="Entrepreneur">Entrepreneur / Commerçant</option>
                <option value="Autre">Autre</option>
            </select>
        </div>
        <div class="form-group">
            <label>Revenu Mensuel (FDJ)</label>
            <input type="number" id="income" class="form-control" placeholder="Ex: 150000" required>
        </div>

        <div class="summary-card">
            <div class="summary-row"><span>Montant :</span><strong id="sumAmount">--</strong></div>
            <div class="summary-row"><span>Durée :</span><strong id="sumTerm">--</strong></div>
            <div class="summary-row"><span>Téléphone :</span><strong id="sumPhone">--</strong></div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="location.href='/page3'">Précédent</button>
            <button type="submit" class="btn-next">Soumettre</button>
        </div>
    </form>
</div>
<div class="footer-banner">© 2026 Djibouti Money</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('sumAmount').innerText = (localStorage.getItem('appliedAmount') || '0') + ' FDJ';
        document.getElementById('sumTerm').innerText = localStorage.getItem('appliedTerm') || '--';
        document.getElementById('sumPhone').innerText = '+253 ' + (localStorage.getItem('phone') || '--');
    });
    function submitForm(e) {
        e.preventDefault();
        window.location.href = "/page5";
    }
</script>
</body>
</html>
