<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Djibouti Money - Demande de Prêt</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary-yellow: #facc15; --bg-color: #ffffff; --card-bg: #fffdf5; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .app-header { width: 100%; background: #ffffff; border-bottom: 2px solid #fef08a; height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .back-btn { color: #ca8a04; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 800; color: #ca8a04; }
        .card { background: var(--card-bg); width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px; border-radius: 16px; border: 1px solid #fef08a; box-shadow: 0 4px 20px rgba(0,0,0,0.03); display: flex; flex-direction: column; }
        .main-title { font-size: 24px; color: #111; margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: #666; text-align: center; margin-bottom: 20px; }
        .step-indicator { display: flex; gap: 10px; margin: 0 auto 28px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e5e7eb; border-radius: 2px; }
        .step-bar.active { background-color: #eab308; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        .form-group label { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 8px; }
        .form-control { font-size: 15px; padding: 14px; border: 1px solid #fde047; border-radius: 10px; background: #fff; outline: none; width: 100%; }
        textarea.form-control { resize: none; height: 85px; }
        .btn-next { background-color: #eab308; color: #000; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #666; margin-top: auto; }
    </style>
</head>
<body>
<div class="app-header">
    <a href="/" class="back-btn">← Retour</a>
    <div class="header-title">Djibouti Money</div>
    <div style="width: 24px;"></div>
</div>

<div class="card">
    <h1 class="main-title">Demande de Prêt</h1>
    <div class="subtext">Étape 1 sur 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <form onsubmit="submitStep1(event)">
        <div class="form-group">
            <label>Type de Prêt</label>
            <select id="loanType" class="form-control" required>
                <option value="Prêt Personnel">Prêt Personnel</option>
                <option value="Prêt Professionnel">Prêt Professionnel</option>
                <option value="Prêt d'Urgence">Prêt d'Urgence</option>
            </select>
        </div>
        <div class="form-group">
            <label>Montant du Prêt (FDJ)</label>
            <input type="number" id="loanAmt" class="form-control" value="250000" required>
        </div>
        <div class="form-group">
            <label>Durée du Prêt</label>
            <select id="loanTerm" class="form-control" required>
                <option value="6 Mois">6 Mois</option>
                <option value="12 Mois" selected>12 Mois</option>
                <option value="24 Mois">24 Mois</option>
            </select>
        </div>
        <div class="form-group">
            <label>Objet du Prêt</label>
            <textarea id="loanPurpose" class="form-control" placeholder="Raison du prêt..." required></textarea>
        </div>
        <button type="submit" class="btn-next">ÉTAPE SUIVANTE</button>
    </form>
</div>
<div class="footer-banner">© 2026 Djibouti Money</div>

<script>
    window.onload = () => {
        if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
        const amt = localStorage.getItem('amount');
        if (amt) document.getElementById('loanAmt').value = amt;
    };
    function submitStep1(e) {
        e.preventDefault();
        localStorage.setItem('appliedAmount', document.getElementById('loanAmt').value);
        localStorage.setItem('appliedTerm', document.getElementById('loanTerm').value);
        localStorage.setItem('appliedPurpose', document.getElementById('loanPurpose').value);
        window.location.href = "/page3";
    }
</script>
</body>
</html>
